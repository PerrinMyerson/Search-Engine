<html>
  <head>
    <title>Float Link Color Fixture</title>

      td { color: #828282; }
      a:link { color: #000000; }
      .infobox { float: right; width: 25%; background: rgb(238, 238, 238); }

    <div class="infobox">Facts box</div>
    <table><tr><td bgcolor="#ff6600"><a href="/story">Story title</a> details</td></tr></table>
  </body>
